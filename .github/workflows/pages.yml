name: GitHub Pages

# Veröffentlicht das Spiel als statische Seite. index.html ist das gesamte
# Spiel, deshalb besteht die Seite aus genau dieser einen Datei.
on:
  push:
    branches: [claude/donkey-kong-office-game-b3eg1x]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Pages einrichten
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Seite zusammenstellen
        run: |
          mkdir -p _site
          cp index.html _site/index.html

      - name: Seite hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
