<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>KARRIERELEITER — Arcade 1981</title>
<style>
:root{ --u:2px; --neon:#ffcc00; }
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; overflow:hidden; user-select:none; -webkit-user-select:none; touch-action:none;
  font-family:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,"Courier New",monospace;
  color:#e8ecf5;
  display:flex; align-items:center; justify-content:center;
  background:
    radial-gradient(90% 60% at 50% 8%,  rgba(120,60,180,.16) 0%, rgba(0,0,0,0) 60%),
    radial-gradient(70% 50% at 12% 90%, rgba(0,140,190,.13) 0%, rgba(0,0,0,0) 60%),
    radial-gradient(70% 50% at 88% 90%, rgba(220,60,80,.11) 0%, rgba(0,0,0,0) 60%),
    linear-gradient(#0a0a10 0%, #0a0a10 62%, #0d0d16 62.2%, #06060b 100%);
}
/* Bodenraster des Spielhallenraums */
body:after{
  content:""; position:fixed; left:-20%; right:-20%; bottom:0; height:38%;
  background:
    repeating-linear-gradient(90deg, rgba(255,255,255,.045) 0 1px, transparent 1px 64px),
    repeating-linear-gradient(0deg,  rgba(255,255,255,.05) 0 1px, transparent 1px 34px);
  transform:perspective(320px) rotateX(72deg); transform-origin:bottom center;
  pointer-events:none; z-index:0;
}

/* ============================== AUTOMAT ============================== */
#cab{
  position:relative; z-index:1;
  width:calc(var(--u)*262);
  padding:0 calc(var(--u)*10) calc(var(--u)*10);
  border-radius:calc(var(--u)*14) calc(var(--u)*14) calc(var(--u)*4) calc(var(--u)*4);
  background:
    linear-gradient(180deg,#2a2f42 0%,#1d2131 8%,#171b28 60%,#12151f 100%),
    #171b28;
  box-shadow:
    inset 0 0 0 calc(var(--u)*1) #39405a,
    inset calc(var(--u)*4) 0 0 rgba(255,255,255,.05),
    inset calc(var(--u)*-4) 0 0 rgba(0,0,0,.35),
    0 calc(var(--u)*10) calc(var(--u)*30) rgba(0,0,0,.75);
}
body.nocab #cab{ width:auto; padding:0; background:none; box-shadow:none; }
body.nocab .cab-marquee,body.nocab .cab-panel,body.nocab .cab-coin,body.nocab .cab-vents{display:none}
/* Seitenstreifen ("Side Art") */
#cab:before,#cab:after{
  content:""; position:absolute; top:calc(var(--u)*56); bottom:calc(var(--u)*12);
  width:calc(var(--u)*4); border-radius:calc(var(--u)*2);
  background:linear-gradient(180deg,#ff4d3d,#ffcc00 40%,#3ad0ff 75%,#8f6bff);
  opacity:.75;
}
#cab:before{ left:calc(var(--u)*3); } #cab:after{ right:calc(var(--u)*3); }
body.nocab #cab:before,body.nocab #cab:after{display:none}

.cab-marquee{
  margin:calc(var(--u)*8) calc(var(--u)*-8) calc(var(--u)*7);
  height:calc(var(--u)*34); border-radius:calc(var(--u)*4);
  display:flex; align-items:center; justify-content:center;
  background:linear-gradient(180deg,#fffdf4,#ffe9b0 45%,#ffcf6a 55%,#ffdf9a 100%);
  box-shadow:inset 0 0 calc(var(--u)*6) rgba(255,140,0,.55),
             0 0 calc(var(--u)*14) rgba(255,170,40,.35),
             inset 0 0 0 calc(var(--u)*1) #6d4a12;
  overflow:hidden;
}
.cab-marquee span{
  font-weight:900; letter-spacing:.30em; text-indent:.30em;
  font-size:calc(var(--u)*13); line-height:1;
  color:#b3231a;
  text-shadow:0 calc(var(--u)*1) 0 #ffb03a, 0 calc(var(--u)*-1) 0 #7a1410;
  animation:flick 7s infinite steps(1);
}
@keyframes flick{0%,96%{opacity:1}96.5%{opacity:.6}97%{opacity:1}98.5%{opacity:.75}99%{opacity:1}}

.cab-vents{
  height:calc(var(--u)*5); margin:0 calc(var(--u)*2) calc(var(--u)*6);
  border-radius:calc(var(--u)*2);
  background:repeating-linear-gradient(90deg,#0d1018 0 calc(var(--u)*3),#20263a calc(var(--u)*3) calc(var(--u)*6));
  box-shadow:inset 0 0 calc(var(--u)*3) #000;
}
.cab-bezel{
  padding:calc(var(--u)*9); border-radius:calc(var(--u)*8);
  background:linear-gradient(180deg,#0c0e16,#05060a);
  box-shadow:inset 0 0 0 calc(var(--u)*1) #2b3247, inset 0 0 calc(var(--u)*10) #000;
}
body.nocab .cab-bezel{padding:calc(var(--u)*3)}
#screenwrap{
  position:relative; line-height:0; overflow:hidden; background:#000;
  border-radius:calc(var(--u)*3);
  box-shadow:0 0 calc(var(--u)*12) rgba(90,160,255,.10), inset 0 0 calc(var(--u)*6) #000;
}
canvas{ image-rendering:pixelated; image-rendering:crisp-edges; display:block; background:#000; }

/* Bedienfeld */
.cab-panel{
  position:relative; height:calc(var(--u)*50); margin:calc(var(--u)*8) calc(var(--u)*-8) 0;
  border-radius:calc(var(--u)*4) calc(var(--u)*4) calc(var(--u)*2) calc(var(--u)*2);
  background:linear-gradient(180deg,#2b3145 0%,#20263a 55%,#1a1f2e 100%);
  box-shadow:inset 0 calc(var(--u)*1) 0 rgba(255,255,255,.10), inset 0 0 0 calc(var(--u)*1) #39405a;
  display:flex; align-items:center; justify-content:space-between;
  padding:0 calc(var(--u)*16);
}
.joy{
  position:relative; width:calc(var(--u)*38); height:calc(var(--u)*46);
  margin-top:calc(var(--u)*-13);
  cursor:grab; touch-action:none;
  filter:drop-shadow(0 calc(var(--u)*2) calc(var(--u)*3) rgba(0,0,0,.55));
}
.joy.drag{ cursor:grabbing; }
.joy svg{ width:100%; height:100%; display:block; overflow:visible; }
.btns{ display:flex; gap:calc(var(--u)*10); align-items:center; }
.btwrap{ display:flex; flex-direction:column; align-items:center; gap:calc(var(--u)*2); }
.btwrap span{ font-size:calc(var(--u)*4); letter-spacing:.18em; color:#59627d; }
.bt{
  position:relative;
  width:calc(var(--u)*17); height:calc(var(--u)*17); border-radius:50%;
  cursor:pointer; touch-action:none; user-select:none;
  display:flex; align-items:center; justify-content:center;
  font-size:calc(var(--u)*6); font-weight:900; color:rgba(0,0,0,.5);
  box-shadow:
    0 0 0 calc(var(--u)*1.6) #2b3143,
    0 0 0 calc(var(--u)*2.4) #767f96,
    inset 0 calc(var(--u)*-2.5) calc(var(--u)*2) rgba(0,0,0,.38),
    inset 0 calc(var(--u)*2) calc(var(--u)*2) rgba(255,255,255,.35),
    0 calc(var(--u)*3) calc(var(--u)*3) rgba(0,0,0,.55);
  transition:transform .05s linear, box-shadow .05s linear, filter .05s linear;
}
.bt.b1{ background:radial-gradient(circle at 35% 30%,#ffe27a,#ffb02e 60%,#9a6404); }
.bt.b2{ background:radial-gradient(circle at 35% 30%,#9df0ff,#2fb8e0 60%,#0a5f7a); }
.bt.on{
  transform:translateY(calc(var(--u)*2.5)); filter:brightness(1.45);
  box-shadow:
    0 0 0 calc(var(--u)*1.6) #2b3143,
    0 0 0 calc(var(--u)*2.4) #767f96,
    inset 0 calc(var(--u)*-1) calc(var(--u)*2) rgba(0,0,0,.5),
    0 calc(var(--u)*1) calc(var(--u)*1) rgba(0,0,0,.5);
}
.panel-label{
  position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  font-size:calc(var(--u)*5); letter-spacing:.28em; color:#59627d; white-space:nowrap;
}
/* Münzeinwurf */
.cab-coin{
  height:calc(var(--u)*24); margin:calc(var(--u)*6) calc(var(--u)*-8) 0;
  border-radius:calc(var(--u)*2);
  background:linear-gradient(180deg,#171b28,#0e111a);
  box-shadow:inset 0 0 0 calc(var(--u)*1) #333a52;
  display:flex; align-items:center; justify-content:center; gap:calc(var(--u)*10);
}
.slot{
  width:calc(var(--u)*16); height:calc(var(--u)*12); border-radius:calc(var(--u)*1);
  background:linear-gradient(180deg,#0a0c12,#05060a);
  box-shadow:inset 0 0 0 calc(var(--u)*1) #4a5268;
  position:relative;
}
.slot:after{
  content:""; position:absolute; left:50%; top:calc(var(--u)*3); transform:translateX(-50%);
  width:calc(var(--u)*2); height:calc(var(--u)*6); background:#000; border-radius:calc(var(--u)*1);
  box-shadow:0 0 0 calc(var(--u)*1) #6b7490;
}
.coin-label{ font-size:calc(var(--u)*5); letter-spacing:.24em; color:#6b7490; }

/* ============================ BILDSCHIRM ============================= */
#scanlines{
  position:absolute; inset:0; pointer-events:none; z-index:5;
  background:repeating-linear-gradient(to bottom, rgba(0,0,0,.32) 0 1px, rgba(0,0,0,0) 1px 3px);
  mix-blend-mode:multiply;
}
#glare{
  position:absolute; inset:0; pointer-events:none; z-index:6;
  background:
    radial-gradient(60% 40% at 22% 8%, rgba(255,255,255,.055) 0%, rgba(255,255,255,0) 70%),
    radial-gradient(130% 100% at 50% 50%, rgba(0,0,0,0) 52%, rgba(0,0,0,.62) 100%);
}
body.noscan #scanlines,body.noscan #glare{display:none}
#flash{position:absolute; inset:0; z-index:7; pointer-events:none; background:#fff; opacity:0}

/* =============================== MENÜS ============================== */
#overlay{
  position:absolute; inset:0; z-index:10; display:none;
  background:rgba(4,6,12,.93); color:#e9edf6;
  padding:calc(var(--u)*7) calc(var(--u)*6); overflow:auto;
  font-size:calc(var(--u)*5.4); line-height:1.62; letter-spacing:.03em;
}
#overlay.on{display:block}
.m-title{
  color:var(--neon); letter-spacing:.24em; font-weight:800; font-size:calc(var(--u)*6.4);
  text-align:center; text-shadow:0 0 calc(var(--u)*5) rgba(255,190,0,.6);
  border-bottom:1px dashed #39425a; padding-bottom:calc(var(--u)*3); margin-bottom:calc(var(--u)*4);
}
.m-sub{color:#7f8aa6; text-align:center; margin:calc(var(--u)*-2) 0 calc(var(--u)*4);
  font-size:calc(var(--u)*4.4); letter-spacing:.16em}
.m-item{display:flex; justify-content:space-between; gap:calc(var(--u)*5);
  padding:calc(var(--u)*.8) calc(var(--u)*3); border-radius:calc(var(--u)*1.5); white-space:nowrap}
.m-item .lbl{overflow:hidden; text-overflow:ellipsis}
.m-item .val{color:#79d0ff; font-weight:700}
.m-item.sel{background:linear-gradient(90deg,#3a2b00,#6b4a00); color:#fff;
  box-shadow:inset 0 0 0 1px #a37c00}
.m-item.sel .lbl:before{content:"\25B8 "; color:var(--neon)}
.m-item.sel .val{color:#ffe08a}
.m-item.dis{opacity:.42}
.m-item.on .val{color:#7cf29a}
.m-gap{height:calc(var(--u)*3.5)}
.m-note{color:#8d97b3; font-size:calc(var(--u)*4.4); margin-top:calc(var(--u)*4);
  border-top:1px dashed #39425a; padding-top:calc(var(--u)*3); white-space:pre-wrap; line-height:1.5}
.m-foot{color:#5f6a86; font-size:calc(var(--u)*4.4); text-align:center; margin-top:calc(var(--u)*4)}
#kb{display:grid; grid-template-columns:repeat(10,1fr); gap:calc(var(--u)*1.4); margin:calc(var(--u)*4) 0}
#kb div{background:#161b27; border:1px solid #2b3346; border-radius:calc(var(--u)*1.5);
  text-align:center; padding:calc(var(--u)*1.6) 0; font-weight:700}
#kb div.sel{background:#6b4a00; border-color:#ffc83d; color:#fff; box-shadow:0 0 calc(var(--u)*3) rgba(255,190,0,.5)}
#code{
  text-align:center; font-size:calc(var(--u)*8); letter-spacing:.34em; font-weight:800; color:var(--neon);
  background:#0a0d15; border:1px solid #333d54; border-radius:calc(var(--u)*2);
  padding:calc(var(--u)*2.5); margin:calc(var(--u)*3) 0; min-height:calc(var(--u)*13);
  text-shadow:0 0 calc(var(--u)*4) rgba(255,190,0,.5);
}
#touch{position:absolute; inset:0; z-index:8; display:none}
#touch.on{display:block}
.tbtn{
  position:absolute; background:rgba(255,255,255,.09); border:1px solid rgba(255,255,255,.22);
  border-radius:50%; color:#fff; font-size:calc(var(--u)*7); display:flex;
  align-items:center; justify-content:center;
}
.tbtn:active,.tbtn.hit{background:rgba(255,200,0,.35)}
</style>

<div id="cab">
  <div class="cab-marquee"><span>KARRIERELEITER</span></div>
  <div class="cab-vents"></div>
  <div class="cab-bezel">

            <stop offset="0%" stop-color="#727c92"/><stop offset="55%" stop-color="#39415390"/>

<script>
"use strict";
/* =====================================================================
   KARRIERELEITER  —  ein Büro-Kletter-Arcade-Spiel im Geiste von 1981
   Alles in einer Datei: Engine, Grafik, Sound, Menüs, Cheats.
   ===================================================================== */

/* ---------------------------------------------------------------- Basis */
const CW = 224, CH = 272;         // interne Auflösung (Arcade-Hochformat)
const HUD_H = 26;                 // Kopfzeile
const PW = CW, PH = CH - HUD_H;   // Spielfeld

const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d', { alpha:false });
ctx.imageSmoothingEnabled = false;

const clamp = (v,a,b) => v<a?a:(v>b?b:v);
const lerp  = (a,b,t) => a+(b-a)*t;
const rnd   = (a=1,b=0) => b+Math.random()*(a-b);
const rndi  = (n) => (Math.random()*n)|0;
const pick  = (a) => a[(Math.random()*a.length)|0];
const now   = () => performance.now();
const aabb  = (a,b) => a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;

/* ------------------------------------------------------- Einstellungen */
const DEFAULTS = {
  volMaster:0.7, music:true, sfx:true,
  scanlines:true, shake:true, scale:0, flashFx:true, cabinet:true,
  difficulty:1,           // 0 Praktikant, 1 Normal, 2 Manager, 3 Burnout
  startLives:3,
  deadzone:0.35, rumble:true,
  showFps:false, touchCtl:'auto',
  keys:{
    left:['ArrowLeft','KeyA'], right:['ArrowRight','KeyD'],
    up:['ArrowUp','KeyW'], down:['ArrowDown','KeyS'],
    jump:['Space','KeyK','KeyJ'], start:['Enter','KeyF'],
    pause:['Escape','KeyP'], back:['Backspace']
  }
};
const DIFF = [
  { name:'PRAKTIKANT', spawn:1.55, spd:0.82, bonus:1.30, label:'gemütlich' },
  { name:'NORMAL',     spawn:1.00, spd:1.00, bonus:1.00, label:'so wie 1981' },
  { name:'MANAGER',    spawn:0.74, spd:1.18, bonus:0.85, label:'straff getaktet' },
  { name:'BURNOUT',    spawn:0.52, spd:1.38, bonus:0.70, label:'nicht empfohlen' },
];

let S = load('kl_settings', DEFAULTS);
function load(k, def){
  try{ const r = JSON.parse(localStorage.getItem(k)); if(!r) return structuredClone(def);
       return Object.assign(structuredClone(def), r); }catch(e){ return structuredClone(def); }
}
function save(){ try{ localStorage.setItem('kl_settings', JSON.stringify(S)); }catch(e){} }
function loadScores(){
  try{ const r = JSON.parse(localStorage.getItem('kl_scores')); if(Array.isArray(r)&&r.length) return r; }catch(e){}
  return [['CHF',18000],['BOS',14000],['KLD',11000],['ABT',9000],['PRK',7500],
          ['AZU',6000],['HR ',4500],['IT ',3000],['KAF',2000],['DU ',1000]];
}
let scores = loadScores();
function saveScores(){ try{ localStorage.setItem('kl_scores', JSON.stringify(scores)); }catch(e){} }

/* -------------------------------------------------------------- Eingabe */
const ACTIONS = ['left','right','up','down','jump','start','pause','back'];
const PAD_MAP = { 0:'jump', 1:'back', 2:'jump', 3:'start', 8:'back', 9:'pause',
                  12:'up', 13:'down', 14:'left', 15:'right', 4:'back', 5:'start' };
const IN = {
  held:{}, hit:{}, rel:{}, prev:{}, anyHit:false, lastKey:null, lastPad:null,
  padIndex:-1, padName:'', usingPad:false, repeat:{},
};
ACTIONS.forEach(a=>{ IN.held[a]=false; IN.hit[a]=false; IN.rel[a]=false; IN.prev[a]=false; IN.repeat[a]=0; });
const rawKeys = new Set();
const latched = new Set();   // garantiert mind. einen Frame "gedrückt"
const touchHeld = {};

addEventListener('keydown', e=>{
  if(e.repeat){ e.preventDefault(); return; }
  rawKeys.add(e.code); latched.add(e.code); IN.lastKey = e.code; IN.usingPad = false;
  if(e.code==='F1'||e.code==='F2'||e.code==='Space'||e.code.startsWith('Arrow')||e.code==='Tab') e.preventDefault();
  hooks.key && hooks.key(e);
  audioUnlock();
});
addEventListener('keyup',   e=>{ rawKeys.delete(e.code); });
addEventListener('blur',    ()=> rawKeys.clear());
addEventListener('gamepadconnected',   e=>{ IN.padIndex=e.gamepad.index; IN.padName=e.gamepad.id.slice(0,28); toast('CONTROLLER VERBUNDEN'); });
addEventListener('gamepaddisconnected',e=>{ if(IN.padIndex===e.gamepad.index){IN.padIndex=-1; toast('CONTROLLER GETRENNT');} });

function padState(){
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  let gp = null;
  if(IN.padIndex>=0 && pads[IN.padIndex]) gp = pads[IN.padIndex];
  else for(const p of pads) if(p && p.connected){ gp=p; IN.padIndex=p.index; IN.padName=p.id.slice(0,28); break; }
  return gp;
}
function pollInput(){
  const s = {}; ACTIONS.forEach(a=> s[a]=false);
  // Beim Cheat-Terminal tippen Buchstaben/Ziffern Text – sie dürfen dann keine
  // Spielaktion auslösen (sonst navigiert "A" gleichzeitig die Bildschirmtastatur).
  const typing = c => typeof cheatScreen!=='undefined' && cheatScreen.active &&
                 (/^Key[A-Z]$/.test(c) || /^Digit[0-9]$/.test(c) || c==='Enter' || c==='Backspace');
  for(const a of ACTIONS) for(const c of S.keys[a])
    if(!typing(c) && (rawKeys.has(c)||latched.has(c))) s[a]=true;
  for(const a of ACTIONS) if(touchHeld[a]) s[a]=true;

  const gp = padState();
  if(gp){
    const dz = S.deadzone;
    const ax = gp.axes[0]||0, ay = gp.axes[1]||0;
    if(ax<-dz) s.left=true; if(ax>dz) s.right=true;
    if(ay<-dz) s.up=true;   if(ay>dz) s.down=true;
    const ax2 = gp.axes[2]||0, ay2 = gp.axes[3]||0;
    if(ax2<-dz) s.left=true; if(ax2>dz) s.right=true;
    if(ay2<-dz) s.up=true;   if(ay2>dz) s.down=true;
    gp.buttons.forEach((b,i)=>{
      if(b && (b.pressed||b.value>0.5)){
        const a = PAD_MAP[i]; if(a) s[a]=true;
        IN.lastPad = i; IN.usingPad = true; audioUnlock();
      }
    });
  }
  IN.anyHit = false;
  for(const a of ACTIONS){
    IN.hit[a] = s[a] && !IN.prev[a];
    IN.rel[a] = !s[a] && IN.prev[a];
    IN.held[a] = s[a];
    IN.prev[a] = s[a];
    if(IN.hit[a]) IN.anyHit = true;
    // Auto-Repeat für Menü-Navigation
    if(s[a]) IN.repeat[a] = IN.hit[a] ? -16 : IN.repeat[a]+1; else IN.repeat[a]=0;
  }
  latched.clear();
}
function menuHit(a){ // Navigation mit Wiederholung
  if(IN.hit[a]) return true;
  if(IN.held[a] && IN.repeat[a]>0 && IN.repeat[a]%5===0) return true;
  return false;
}

  }
}

function audioUnlock(){
  if(AC) { if(AC.state==='suspended') AC.resume(); return; }
  try{
    AC = new (window.AudioContext||window.webkitAudioContext)();
    masterGain = AC.createGain(); masterGain.gain.value = S.volMaster; masterGain.connect(AC.destination);
    musicGain  = AC.createGain(); musicGain.gain.value = S.music?0.55:0; musicGain.connect(masterGain);
    sfxGain    = AC.createGain(); sfxGain.gain.value   = S.sfx?0.85:0;   sfxGain.connect(masterGain);
  }catch(e){ }
}

const NOTE = {};
(function(){
  const names=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  for(let o=0;o<8;o++) for(let i=0;i<12;i++)
    NOTE[names[i]+o] = 440*Math.pow(2,(o*12+i-57)/12);
  NOTE['-']=0;
})();
function tone(freq, dur, opt={}){
  if(!AC||!S.sfx) return;
  const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = opt.type||'square'; o.frequency.setValueAtTime(freq, t);
  if(opt.slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,opt.slide), t+dur);
  const v = (opt.vol??0.25);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(v, t+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(sfxGain); o.start(t); o.stop(t+dur+0.02);
}
function noise(dur=0.2, vol=0.25, hp=400){
  if(!AC||!S.sfx) return;
  const n = Math.floor(AC.sampleRate*dur), buf = AC.createBuffer(1,n,AC.sampleRate), d = buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i] = (Math.random()*2-1)*(1-i/n);
  const src = AC.createBufferSource(); src.buffer = buf;
  const f = AC.createBiquadFilter(); f.type='highpass'; f.frequency.value=hp;
  const g = AC.createGain(); g.gain.value = vol;
  src.connect(f); f.connect(g); g.connect(sfxGain); src.start();
}

let mus = { name:null, t:0, step:0, timer:null };
function playMusic(name){
  if(mus.name===name) return;
  stopMusic(); if(!AC||!S.music||!MUSIC[name]) { mus.name=name; return; }
  const m = MUSIC[name], lead=m.lead.split(/\s+/), bass=m.bass.split(/\s+/);
  const spb = 60/m.bpm/2*1000;
  mus.name = name; mus.step = 0;
  mus.timer = setInterval(()=>{
    if(!AC||!S.music) return;
    const i = mus.step++;
    const ln = lead[i%lead.length], bn = bass[i%bass.length];
    const t = AC.currentTime;
    if(ln && ln!=='-' && NOTE[ln]) msynth(NOTE[ln], spb/1000*0.9, 'square', 0.16);
    if(bn && bn!=='-' && NOTE[bn]) msynth(NOTE[bn], spb/1000*0.9, 'triangle', 0.20);
  }, spb);
}
function msynth(f,d,type,v){
  if(!AC) return;
  const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
  o.type=type; o.frequency.value=f;
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(v,t+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g); g.connect(musicGain); o.start(t); o.stop(t+d+0.02);
}
function stopMusic(){ if(mus.timer) clearInterval(mus.timer); mus.timer=null; mus.name=null; }

function P(x1,y1,x2,y2,o={}){ return Object.assign({x1,y1,x2,y2,type:'girder',conv:0,dyn:false,gone:false},o); }
function surfaceY(p,x){
  if(p.x2===p.x1) return p.y1;
  const t = clamp((x-p.x1)/(p.x2-p.x1),0,1);
  return p.y1+(p.y2-p.y1)*t;
}
function onPlat(p,x){ return !p.gone && x>=p.x1-1 && x<=p.x2+1; }
function LAD(pt,pb,x,o={}){
  return Object.assign({ x, yTop:surfaceY(pt,x), yBot:surfaceY(pb,x), broken:false, top:pt, bot:pb }, o);
}

/* ------------------------------------------------------------- Physik */
function allPlats(){ return L.plats; }
function landing(x, feetPrev, feetNow){
  let best=null, by=1e9;
  for(const p of L.plats){
    if(p.gone) continue;
    if(x < p.x1-1 || x > p.x2+1) continue;
    const sy = surfaceY(p,x);
    if(feetPrev <= sy+1.5 && feetNow >= sy-0.001){
      if(sy < by){ by = sy; best = p; }
    }
  }
  return best;
}
// mode: 'up' = am Fuss einsteigen, 'down' = oben einsteigen, 'grab' = mittendrin
const LAD_GRAB = 11;   // wie weit seitlich man eine Leiter noch erwischt
const LAD_HELP = 26;   // ab hier rutscht man beim Halten von Hoch/Runter hin
function findLadder(cx, feet, mode, maxDX=LAD_GRAB, healthyOnly=false){
  let best=null, bd=999;
  for(const l of L.lads){
    if(healthyOnly && l.broken) continue;
    const d = Math.abs(cx - l.x);
    if(d > maxDX) continue;
    let ok=false;
    if(mode==='up')        ok = Math.abs(feet-l.yBot)<7 && feet > ladLimit(l)+2;
    else if(mode==='down') ok = Math.abs(feet-l.yTop)<7 && !l.broken;
    else                   ok = feet > l.yTop+1 && feet < l.yBot-1;
    if(ok && d < bd){ bd=d; best=l; }
  }
  return best;
}
function ladLimit(l){ return l.broken ? l.yTop + (l.yBot-l.yTop)*0.62 : l.yTop; }

function updatePlayer(dt){
  const p = P_;
  if(!p.alive) return;
  const m = spdMul();
  let LEFT = IN.held.left, RIGHT = IN.held.right;
  if(kaosFx.invert){ const t=LEFT; LEFT=RIGHT; RIGHT=t; }
  const walkSpeed = 1.02*m*(CHEAT.turbo?1.25:1);

  // --- Leiter ----------------------------------------------------------
  if(p.onLad){
    const l = p.lad, lim = ladLimit(l);
    let mv = 0;
    if(IN.held.up)   mv = -0.80*m;
    if(IN.held.down) mv =  0.80*m;
    p.y += mv;
    p.climbAnim += Math.abs(mv)*0.55;
    if(mv && (G.frame%9===0)) SFX.climb();
    const feet = p.y+p.h;
    if(feet < lim){ // oben raus
      if(l.broken){ p.y = lim - p.h; if(IN.held.up) hintBroken(l); }
      else {
        p.onLad=false; p.plat=l.top; p.y = surfaceY(l.top,p.x+p.w/2)-p.h; p.vy=0;
      }
    }
    if(feet > l.yBot){ // unten raus
      p.onLad=false; p.plat=l.bot; p.y = surfaceY(l.bot,p.x+p.w/2)-p.h; p.vy=0;
    }
    p.x = l.x - p.w/2;
    if(IN.hit.jump && p.hammer<=0){ // von Leiter abspringen
      p.onLad=false; p.vy=-1.6; p.plat=null; p.jump=true; SFX.jump();
    }
    p.lastFeet = p.y+p.h;
    return;
  }

  // --- Boden / Luft ----------------------------------------------------
  // Sprungpuffer (kurz vor der Landung gedrückt zählt) und Kojotenzeit
  // (kurz nach dem Verlassen der Kante darf man noch springen)
  if(IN.hit.jump) p.jumpBuf = 9;
  if(p.jumpBuf>0) p.jumpBuf--;
  const grounded = !!p.plat;
  if(grounded) p.coyote = 7; else if(p.coyote>0) p.coyote--;
  const mayJump = (grounded || (p.coyote>0 && p.vy>=0)) && p.jumpBuf>0;
  if(grounded){
    p.vx = 0;
    if(LEFT){ p.vx=-walkSpeed; p.dir=-1; }
    if(RIGHT){ p.vx= walkSpeed; p.dir= 1; }
    if(p.plat.conv) p.vx += p.plat.conv*0.42*m;
  } else {
    if(LEFT){ p.vx=-walkSpeed; p.dir=-1; }
    else if(RIGHT){ p.vx= walkSpeed; p.dir= 1; }
    p.vy += 0.215*gravMul();
    if(p.vy>4.2) p.vy=4.2;
    p.air++;
  }
  if(mayJump){
    p.vy = -3.15*Math.sqrt(gravMul());
    p.plat=null; p.jump=true; p.air=0; p.jumpBuf=0; p.coyote=0;
    p.jumpScored = new Set(); SFX.jump();
  }
  const feetPrev = p.y+p.h;
  p.x += p.vx;
  p.y += p.vy;
  p.x = clamp(p.x, 0, PW-p.w);
  const cx = p.x+p.w/2, feet = p.y+p.h;

  if(p.plat){
    // Slope folgen / Kante verlassen
    if(!onPlat(p.plat,cx)) { p.plat=null; p.vy=0.1; }
    else { p.y = surfaceY(p.plat,cx)-p.h; if(p.plat.dyn) p.y += 0; }
  } else {
    const lp = landing(cx, feetPrev, feet);
    if(lp && p.vy>=0){
      p.plat = lp; p.y = surfaceY(lp,cx)-p.h; p.vy=0;
      if(p.jump){ p.jump=false; SFX.land(); }
    }
  }
  // --- Leiter greifen ---------------------------------------------------
  if(p.hammer<=0){
    const feetNow = p.y+p.h;
    const steering = LEFT||RIGHT;
    if(IN.held.up){
      const l = (p.plat ? findLadder(cx,feetNow,'up') : null) || findLadder(cx,feetNow,'grab');
      if(l && feetNow > ladLimit(l)+2){ p.onLad=true; p.lad=l; p.plat=null; p.vy=0; p.x=l.x-p.w/2; }
      else if(p.plat && !steering){
        // Einstieghilfe: wer Hoch hält, rutscht sanft zur nächsten heilen Leiter.
        // Kräftiger als ein Förderband, damit das Band einen nicht wegzieht.
        const n = findLadder(cx,feetNow,'up',LAD_HELP,true);
        if(n){ const d=Math.sign(n.x-cx); p.x += d*(p.plat.conv?1.3:0.75); p.dir = d||p.dir; }
        else if(l) hintBroken(l);
      }
      else if(l && l.broken && Math.abs((p.y+p.h)-ladLimit(l))<3) hintBroken(l);
    } else if(IN.held.down && p.plat){
      const l = findLadder(cx,feetNow,'down');
      if(l){ p.onLad=true; p.lad=l; p.plat=null; p.vy=0; p.x=l.x-p.w/2; p.y = l.yTop-p.h+3; }
      else if(!steering){
        const n = findLadder(cx,feetNow,'down',LAD_HELP,true);
        if(n){ const d=Math.sign(n.x-cx); p.x += d*(p.plat.conv?1.3:0.75); p.dir = d||p.dir; }
      }
    }
  }
  if(p.hammer>0 && IN.held.up && brokenHintT<=0 && findLadder(cx,p.y+p.h,'up',16)){
    brokenHintT = 2.2;
    pop(p.x-20, p.y-14, 'ERST AUSTRINKEN', '#ffb03a');
  }
  if(p.y > PH+20){ killPlayer('sturz'); }
  if(p.plat && p.vy>0) p.vy=0;
  p.anim += Math.abs(p.vx)*0.42;
  p.lastFeet = feetPrev;
  if(p.hammer>0){
    p.hammer--; p.hamSide = ((G.frame/8)|0)%2;
    if(p.hammer===0){ playMusic(hurry?'hurry':'stage'); }
  }
}
function hammerBox(){
  const p=P_; if(p.hammer<=0) return null;
  const w=13,h=12;
  const x = p.dir>0 ? p.x+p.w-2 : p.x-w+2;
  const y = p.hamSide ? p.y-8 : p.y+2;
  return {x,y,w,h};
}

/* ------------------------------------------------------------ Gegner */
function addBarrel(wild){
  const b = { x:chef.x+6, y:chef.y-12, w:11, h:11, plat:null, dir:1, vy:0,
              wild:!!wild, spin:0, lad:null, ladT:0, scored:false, kind:'cup' };
  barrels.push(b); SFX.throwB();
}
function addMemo(row){
  const p = row, d = p.conv||1;
  const x = d>0 ? p.x1+2 : p.x2-12;
  memos.push({ x, y:surfaceY(p,x)-10, w:11,h:10, plat:p, dir:d, scored:false, kind:'memo', spin:0 });
}
function addFlame(){
  const f = L.flames.from;
  flames.push({ x:f.x, y:f.y-14, w:10,h:13, plat:L.plats[0], dir:pick([-1,1]),
                vy:0, onLad:false, lad:null, anim:rnd(6), think:0, kind:'flame' });
}
function addSpring(){
  springs.push({ x:L.springs.x0||(L.chef.x+18), y:L.springs.y-10, w:11,h:9,
                 vx:1.15, vy:0, phase:0, kind:'spring', scored:false });
}
function stepRoller(b, dt, speedBase){
  const m = spdMul();
  if(b.lad){ // Leiterfahrt
    b.y += 0.85*m;
    b.spin += 0.2;
    if(b.y+b.h >= b.lad.yBot){ b.plat = b.lad.bot; b.y = surfaceY(b.plat,b.x+b.w/2)-b.h;
      b.dir = slopeDir(b.plat, b.dir); b.lad=null; }
    return;
  }
  if(!b.plat){
    b.vy += 0.22*gravMul(); b.y += b.vy; b.spin += 0.12;
    const feetPrev = b.y+b.h-b.vy, feet=b.y+b.h;
    const lp = landing(b.x+b.w/2, feetPrev, feet);
    if(lp){ b.plat=lp; b.y=surfaceY(lp,b.x+b.w/2)-b.h; b.vy=0; b.dir=slopeDir(lp,b.dir); }
    else if(b.y>PH+16) b.dead=true;
    return;
  }
  const sp = speedBase*m*(b.wild?1.15:1);
  b.x += b.dir*sp;
  b.spin += b.dir*sp*0.22;
  const cx=b.x+b.w/2;
  if(!onPlat(b.plat,cx)){ b.plat=null; b.vy=0.2; return; }
  b.y = surfaceY(b.plat,cx)-b.h;
  // Leiter nehmen?
  b.ladT -= dt;
  if(b.ladT<=0){
    for(const l of L.lads){
      if(l.broken) continue;
      if(Math.abs(cx-l.x)<2.2 && l.top===b.plat){
        const ch = b.wild?0.92:(0.24+0.05*G.loop);
        if(Math.random()<ch){ b.lad=l; b.x=l.x-b.w/2; b.ladT=0.9; }
        else b.ladT = 0.5;
        break;
      }
    }
  }
  if(b.x<-14||b.x>PW+14) b.dead=true;
}
function slopeDir(p, cur){
  if(p.conv) return p.conv;
  const d = p.y2-p.y1;
  if(Math.abs(d)<0.4) return cur||1;
  return d>0?1:-1;
}
function updateEnemies(dt){
  const m = spdMul();
  if(CHEAT.urlaub) return;
  for(const b of barrels) stepRoller(b, dt, 0.92);
  for(const b of memos){
    if(!b.plat){ b.dead=true; continue; }
    b.x += b.dir*0.8*m; b.spin+=0.1;
    if(!onPlat(b.plat,b.x+b.w/2)) { b.dead=true; continue; }
    b.y = surfaceY(b.plat,b.x+b.w/2)-b.h;
  }
  for(const s of springs){
    s.x += s.vx*m; s.phase += 0.16*m;
    s.y = L.springs.y - 10 - Math.abs(Math.sin(s.phase))*22;
    if(s.x > (L.springs.xEnd||172)){ s.falling = true; }
    if(s.falling){ s.y += 3.0*m; s.x += 0.3; if(s.y>PH+10) s.dead=true; }
    else if(s.x>PW+10) s.dead=true;
  }
  for(const f of flames){
    f.anim += 0.25;
    f.think -= dt;
    const px = P_.x+P_.w/2, py=P_.y+P_.h;
    if(f.onLad){
      const dirv = (py < f.y) ? -1 : 1;
      f.y += dirv*0.55*m;
      if(f.y+f.h <= f.lad.yTop+1){ f.plat=f.lad.top; f.y=surfaceY(f.plat,f.x+f.w/2)-f.h; f.onLad=false; f.lad=null; f.think=0.7; }
      if(f.y+f.h >= f.lad.yBot){ f.plat=f.lad.bot; f.y=surfaceY(f.plat,f.x+f.w/2)-f.h; f.onLad=false; f.lad=null; f.think=0.7; }
      continue;
    }
    if(!f.plat){ f.vy+=0.2; f.y+=f.vy;
      const lp=landing(f.x+f.w/2, f.y+f.h-f.vy, f.y+f.h);
      if(lp){ f.plat=lp; f.y=surfaceY(lp,f.x+f.w/2)-f.h; f.vy=0; }
      else if(f.y>PH+20){ f.x=L.flames.from.x; f.y=0; }
      continue;
    }
    const myFeet = f.y+f.h, sameRow = Math.abs(myFeet - py) < 22;
    if(f.think<=0){
      f.think = 0.35+rnd(0.5);
      if(!sameRow){
        for(const l of L.lads){
          if(l.broken) continue;
          if(Math.abs((f.x+f.w/2)-l.x)<7 && (l.bot===f.plat || l.top===f.plat)){
            const wantUp = py < myFeet;
            if((wantUp && l.bot===f.plat) || (!wantUp && l.top===f.plat)){
              if(Math.random()<0.7){ f.onLad=true; f.lad=l; f.x=l.x-f.w/2;
                if(!wantUp) f.y = l.yTop-f.h+2; }
            }
            break;
          }
        }
      }
      if(!f.onLad) f.dir = (px < f.x) ? -1 : 1;
      if(Math.random()<0.12) f.dir*=-1;
    }
    if(!f.onLad){
      f.x += f.dir*0.42*m;
      const cx=f.x+f.w/2;
      if(!onPlat(f.plat,cx)){ f.x -= f.dir*0.6; f.dir*=-1; }
      else f.y = surfaceY(f.plat,cx)-f.h;
    }
  }
  barrels = barrels.filter(b=>!b.dead);
  memos   = memos.filter(b=>!b.dead);
  springs = springs.filter(b=>!b.dead);
}

/* ------------------------------------------------------- Chef & Spawns */
function updateChef(dt){
  chef.anim += dt;
  if(L.done) { chef.fall += dt; return; }
  chef.throwT -= dt;
  if(L.barrels && chef.throwT<=0){
    const every = L.barrels.every*diff().spawn/(1+(G.loop-1)*0.15) * (kaosFx.rain?0.35:1);
    chef.throwT = every*rnd(1.25,0.75);
    addBarrel(Math.random() < L.barrels.wildChance + G.loop*0.03);
    chef.hop = 0.35;
  }
  if(L.springs){
    L.springT -= dt;
    if(L.springT<=0){ L.springT = L.springs.every*diff().spawn*rnd(1.3,0.8); addSpring(); chef.hop=0.3; }
  }
  if(L.memos){
    L.memoT -= dt;
    if(L.memoT<=0){ L.memoT = L.memos.every*diff().spawn*rnd(1.4,0.7); addMemo(pick(L.memos.rows)); }
  }
  if(L.fire){
    L.fireT -= dt;
    if(L.fireT<=0 && flames.length < L.fire.max + (G.loop-1)){
      L.fireT = 9;
      L.flames = L.flames || {n:1, from:{x:L.fire.x, y:L.fire.y}};
      L.flames.from = {x:L.fire.x, y:L.fire.y};
      addFlame();
      pop(L.fire.x, L.fire.y-18, 'DEADLINE!', '#ff7a3d');
    }
  }
  if(chef.hop>0) chef.hop -= dt;
}

/* ---------------------------------------------------- Treffer & Punkte */
function pop(x,y,txt,col){ pops.push({x,y,txt,col:col||'#fff',t:1.1}); }
let brokenHintT = 0;
function hintBroken(l){
  if(!l || !l.broken || brokenHintT>0) return;
  brokenHintT = 2.2;
  pop(l.x-16, ladLimit(l)-14, 'LEITER KAPUTT', '#ff6a5c');
  SFX.no();
}
function addScore(n){
  const mult = (S.difficulty===3?2:1)*(CHEAT.kaos?1:1);
  G.score += n*mult;
  if(G.score >= G.extraAt){ G.lives++; G.extraAt += 30000; SFX.extralife(); pop(P_.x,P_.y-14,'1UP','#7cf29a'); }
  if(G.score>G.hi) G.hi=G.score;
}
function burstParts(x,y,col,n=10,spd=1.6){
  for(let i=0;i<n;i++) parts.push({x,y,vx:rnd(spd,-spd),vy:rnd(0.5,-spd*1.6),col,t:rnd(0.9,0.4),g:0.11});
}
function checkCollisions(){
  const p=P_; if(!p.alive||L.done) return;
  const box = {x:p.x+1,y:p.y+2,w:p.w-2,h:p.h-2};
  const hb = hammerBox();
  const foes = [...barrels, ...flames, ...springs, ...memos];
  for(const e of foes){
    const eb = {x:e.x+1,y:e.y+1,w:e.w-2,h:e.h-2};
    if(hb && aabb(hb,eb)){
      e.dead=true; const v = pick([300,500,800]);
      addScore(v); pop(e.x,e.y-6,''+v,'#ffe14d'); burstParts(e.x+5,e.y+5,'#ffd23d',12);
      SFX.hammer(); G.shake=Math.max(G.shake,3); rumble(0.6,90);
      continue;
    }
    if(aabb(box,eb)){
      if(CHEAT.homeoffice){ continue; }
      killPlayer('getroffen'); return;
    }
    // drübergesprungen?
    if(!e.scored && (p.jump||!p.plat) && p.jumpScored){
      const dx = Math.abs((e.x+e.w/2)-(p.x+p.w/2));
      if(dx<11 && (e.y > p.y+p.h-4) && (e.y < p.y+p.h+16)){
        e.scored=true; p.jumpScored.add(e); G.jumpedTotal++;
        const combo = [100,300,500,800][Math.min(p.jumpScored.size-1,3)];
        addScore(combo);
        pop(e.x, e.y-10, combo + (p.jumpScored.size>1? ' x'+p.jumpScored.size : ''),
            p.jumpScored.size>1? '#ffe14d':'#8ad7ff');
        SFX.score();
        if(p.jumpScored.size>1){ rumble(0.35,80); burstParts(e.x+5,e.y,'#ffe14d',6,1.2); }
      }
    }
  }
  for(const it of L.items||[]){
    if(it.got) continue;
    if(aabb(box,{x:it.x-6,y:it.y-2,w:12,h:12})){
      it.got=true; const v = ITEMS.find(i=>i.k===it.k).v;
      addScore(v); pop(it.x-8,it.y-8,''+v,'#ffb3ff'); SFX.item(); burstParts(it.x,it.y+4,'#ff9de0',8);
    }
  }
  for(const h of L.hammers||[]){
    if(h.used) continue;
    if(aabb(box,{x:h.x-6,y:h.y,w:13,h:20})){
      h.used=true; p.hammer = CHEAT.kaffee? 99999 : Math.round(420*diff().bonus);
      p.onLad=false; SFX.coin(); playMusic('hammer'); pop(h.x-14,h.y-8,'ESPRESSO!','#c98b4b');
    }
  }
  if(L.rivets){
    for(const r of L.rivets){
      if(r.got) continue;
      if(aabb(box,{x:r.x-5,y:r.y-6,w:11,h:12})){
        r.got=true; addScore(100); SFX.rivet(); burstParts(r.x,r.y,'#7cf2ff',8);
        pop(r.x-6,r.y-10,'STECKER','#7cf2ff');
        if(L.rivets.every(v=>v.got)) winLevel(true);
      }
    }
  }
  // Ziel erreicht?
  const g = L.goal;
  if(!L.done && aabb(box,{x:g.x-9,y:g.y-20,w:18,h:20})) winLevel(false);
}
function killPlayer(reason){
  if(!P_.alive) return;
  P_.alive=false; P_.dieT=0; G.state='dying';
  stopMusic(); SFX.die(); G.shake=6; rumble(0.9,320);
  burstParts(P_.x+5,P_.y+8,'#ff5a4d',16,2.2);
}
function winLevel(byRivets){
  L.done = true; L.winT = 0; G.state='clear';
  stopMusic(); SFX.clear(); playMusic('win');
  if(byRivets){ G.shake=8; SFX.boss(); }
  addScore(0);
}

const UMLAUT = { 'Ä':'A', 'Ö':'O', 'Ü':'U' };
const GW = 5, GH = 7, GADV = 6, GTOP = 2;      // Zellmasse
const textCache = new Map();

function textScale(size){ return size<=9 ? 1 : size<=13 ? 2 : size<=19 ? 3 : 4; }
function textWidth(str, size){ const sc=textScale(size); return String(str).length*GADV*sc - sc; }

function renderText(str, col, sc){
  const key = str+' '+col+' '+sc;
  const hit = textCache.get(key); if(hit) return hit;
  const chars=[...str];
  const cv = document.createElement('canvas');
  cv.width  = Math.max(1, chars.length*GADV*sc);
  cv.height = (GH+GTOP)*sc;
  const g = cv.getContext('2d');
  g.fillStyle = col;
  chars.forEach((ch,i)=>{
    const base = UMLAUT[ch];
    const rows = FONT[base||ch];
    if(!rows) return;
    const ox = i*GADV*sc;
    for(let y=0;y<GH;y++){
      const r = rows[y];
      let run=0;
      for(let x=0;x<=GW;x++){
        const on = x<GW && r[x]==='X';
        if(on) run++;
        else if(run){ g.fillRect(ox+(x-run)*sc, (y+GTOP)*sc, run*sc, sc); run=0; }
      }
    }
    if(base){ g.fillRect(ox+sc, 0, sc, sc); g.fillRect(ox+3*sc, 0, sc, sc); }
  });
  if(textCache.size>500) textCache.clear();
  textCache.set(key, cv);
  return cv;
}
function text(s,x,y,c='#fff',align='left',size=8){
  s = String(s).toUpperCase();
  const sc = textScale(size), w = s.length*GADV*sc - sc;
  let px0 = x;
  if(align==='center') px0 = x - w/2;
  else if(align==='right') px0 = x - w;
  b.drawImage(renderText(s,c,sc), Math.round(px0), Math.round(y-GTOP*sc));
}
function textS(s,x,y,c,align='left',size=8,sh='#000'){
  const sc = textScale(size);
  text(s,x+sc,y+sc,sh,align,size);
  text(s,x,y,c,align,size);
}

function drawPlats(){

function nearLadder(l){
  if(!P_||!P_.alive||P_.hammer>0) return false;
  const cx=P_.x+P_.w/2, feet=P_.y+P_.h;
  return Math.abs(cx-l.x)<=LAD_GRAB+2 && feet>=l.yTop-10 && feet<=l.yBot+6;

function drawLads(){
  const st = stylePal();

    const hot = nearLadder(l);
    const col = hot ? '#ffffff' : (l.broken ? '#8a6a4a' : st.lad);
    const lim = ladLimit(l);
    const drawRung=(y)=>{ px(l.x-4,y,9,1,col); };
    if(!l.broken){
      px(l.x-5,l.yTop-2,2,(l.yBot-l.yTop)+2, col);
      px(l.x+4,l.yTop-2,2,(l.yBot-l.yTop)+2, col);
      for(let y=l.yBot-4;y>l.yTop;y-=5) drawRung(y);
    } else {
      // unteres Reststück
      px(l.x-5,lim,2,(l.yBot-lim), col);
      px(l.x+4,lim,2,(l.yBot-lim), col);
      for(let y=l.yBot-4;y>lim+2;y-=5) drawRung(y);

      px(l.x-5,lim-2,2,2,col); px(l.x+4,lim-1,2,1,col);

      const gapTop = lim - 16;
      px(l.x-5,l.yTop-2,2,(gapTop-l.yTop)+2, col);
      px(l.x+4,l.yTop-2,2,(gapTop-l.yTop)+2, col);
      for(let y=l.yTop+2;y<gapTop-2;y+=5) drawRung(y);
      px(l.x-5,gapTop,2,1,col); px(l.x+4,gapTop+1,2,2,col);

      for(let i=0;i<3;i++) px(l.x-7+i*5, lim-9, 3, 2, i%2? '#1a1a1a':'#ffd23d');
      for(let i=0;i<3;i++) px(l.x-5+i*5, gapTop+4, 3, 2, i%2? '#ffd23d':'#1a1a1a');

/* Chaos-Modus: es läuft IMMER ein Effekt. Läuft einer aus, startet sofort der
   nächste – dazu Dauerkennzeichen im HUD, damit man ihn nicht übersehen kann. */
const KAOS_FX = {
  invert:  {n:'STEUERUNG VERTAUSCHT', t:[4,7]},
  moon:    {n:'MONDGRAVITATION',      t:[5,8]},
  rush:    {n:'ALLE HEKTISCH',        t:[4,7]},
  rain:    {n:'KAFFEEREGEN',          t:[4,6]},
  tiny:    {n:'MINI-MODUS',           t:[5,8]},
  disco:   {n:'BÜRO-DISCO',           t:[4,7]},
  quake:   {n:'ERDBEBEN',             t:[3,5]},
  mirror:  {n:'SPIEGELVERKEHRT',      t:[3,5]},
  flip:    {n:'ALLES STEHT KOPF',     t:[3,4]},
  blackout:{n:'STROMAUSFALL',         t:[3,5]},
  confetti:{n:'BETRIEBSFEIER',        t:[4,7]},
  frenzy:  {n:'AKTENFLUT',            t:[2,3]},
  extra:   {n:'NEUE DEADLINE',        t:[2,3]},
};
let kaosCur = null, kaosName = '';
function startKaos(){
  const keys = Object.keys(KAOS_FX).filter(k=>k!==kaosCur);
  const fx = pick(keys), d = KAOS_FX[fx];
  kaosFx[fx] = rnd(d.t[1], d.t[0]);
  kaosCur = fx; kaosName = d.n;
  kaosNext = kaosFx[fx] * 0.85;
  toast(d.n+'!', 2.4); SFX.cheat(); G.flash = 0.55;
  if(fx==='extra' && L.flames) addFlame();
  if(fx==='quake') G.shake = 6;
  if(fx==='frenzy') for(let i=0;i<5;i++)
    setTimeout(()=>{ if(G.state==='play') addBarrel(Math.random()<0.5); }, i*160);
}
function updateKaos(dt){
  if(!CHEAT.kaos){ if(kaosCur){ kaosFx={}; kaosCur=null; } return; }
  for(const k in kaosFx){
    kaosFx[k]-=dt;
    if(kaosFx[k]<=0){ delete kaosFx[k]; if(kaosCur===k) kaosCur=null; }
  }
  kaosNext -= dt;
  if(kaosNext<=0 || !kaosCur) startKaos();
  // Dauerwirkungen
  if(kaosFx.rain && G.frame%12===0 && barrels.length<28){
    const x=rnd(PW-16,8);
    barrels.push({x,y:-12,w:11,h:11,plat:null,dir:pick([-1,1]),vy:0.5,
                  wild:Math.random()<0.3,spin:0,scored:false});
  }
  if(kaosFx.confetti && G.frame%2===0){
    parts.push({x:rnd(PW), y:-4, vx:rnd(0.6,-0.6), vy:rnd(1.6,0.7),
                col:pick(['#ff4d3d','#ffd23d','#4de1ff','#7cf29a','#ff8fd0','#fff']),
                t:rnd(3.2,1.8), g:0.004});
  }
  if(kaosFx.quake) G.shake = Math.max(G.shake, 2.5);
}
function updatePlay(dt){
  G.frame++;
  if(brokenHintT>0) brokenHintT-=dt;
  updateKaos(dt);
  // Bonus-Uhr
  G.bonusT += dt;
  const tick = 0.80*diff().bonus;
  if(G.bonusT>tick){
    G.bonusT-=tick; G.bonus-=100;
    if(G.bonus<=1000 && !hurry){ hurry=true; if(P_.hammer<=0) playMusic('hurry'); }
    if(G.bonus<=0){ G.bonus=0; killPlayer('zeit'); }
  }
  if(L.elevs) for(const p of elevPlats){
    const e=p.ev, prev=e.y;
    e.y += e.vy*spdMul();
    let wrapped=false;
    if(e.y < e.top){ e.y = e.bot; wrapped=true; }
    if(e.y > e.bot){ e.y = e.top; wrapped=true; }
    p.y1=p.y2=e.y;
    if(P_.plat===p){
      if(wrapped){ P_.plat=null; P_.vy=0.2; }   // oben nicht ausgestiegen: freier Fall
      else P_.y += (e.y-prev);
    }
    for(const f of flames) if(f.plat===p && !wrapped) f.y += (e.y-prev);
  }
  updatePlayer(dt);
  updateEnemies(dt);
  updateChef(dt);
  checkCollisions();
  if(CHEAT.magnet) for(const it of L.items||[]) if(!it.got){
    const dx=(P_.x+5)-it.x, dy=(P_.y+8)-it.y;
    if(Math.abs(dx)<50&&Math.abs(dy)<40){ it.x+=dx*0.06; it.y+=dy*0.06; }
  }
  if(P_.plat && P_.plat.type==='elev' && P_.y>PH) killPlayer('sturz');
}
function stepState(dt){
  if(G.msgT>0) G.msgT-=dt;
  if(G.shake>0) G.shake=Math.max(0,G.shake-dt*14);
  updateParts(dt);
  switch(G.state){
    case 'title':
      G.frame++;
      if(mus.name!=='title') playMusic('title');
      G.timer+=dt;
      if(G.timer>14){ G.timer=0; G.state='scores'; }
      if(IN.hit.start||IN.hit.jump) startGame(0);
      break;
    case 'scores':
      G.frame++; G.timer+=dt;
      if(G.timer>9){ G.timer=0; G.state='title'; }
      if(IN.hit.start||IN.hit.jump) startGame(0);
      if(IN.hit.back){ G.timer=0; G.state='title'; }
      break;
    case 'howhigh':
      G.frame++; G.timer-=dt;
      if(G.timer<=0){ G.state='play'; playMusic('stage'); }
      if(IN.hit.start && G.timer<1.9){ G.timer=0; }
      break;
    case 'play':
      updatePlay(dt);
      break;
    case 'dying':
      G.frame++; P_.dieT+=dt;
      P_.y -= (P_.dieT<0.6? 0.9 : -1.4);
      if(P_.dieT>2.3){
        G.lives--;
        if(G.lives<=0) gameOver();
        else { buildLevel(); G.state='howhigh'; G.timer=1.6; }
      }
      break;
    case 'clear':
      G.frame++; L.winT+=dt;
      if(L.winT>1.0 && G.bonus>0 && G.frame%2===0){
        const d=Math.min(100,G.bonus); G.bonus-=d; addScore(d);
        if(G.frame%8===0) SFX.score();
      }
      if(L.winT>3.4){ nextStage(); }
      break;
    case 'gameover':
      G.frame++; G.timer-=dt;
      if(G.timer<=0){
        if(G.score>0 && (scores.length<10 || G.score>scores[scores.length-1][1]) && !CHEAT.used){
          nameEntry.init(); G.state='name';
        } else { G.state='title'; G.timer=0; }
      }
      break;
    case 'name':
      G.frame++; nameEntry.update();
      break;
  }
}

const nameEntry = {
  chars:['A','A','A'], pos:0,
  init(){ this.chars=['A','A','A']; this.pos=0; },
  update(){
    if(menuHit('up')){ this.bump(1); }
    if(menuHit('down')){ this.bump(-1); }
    if(IN.hit.right){ this.pos=Math.min(2,this.pos+1); SFX.menu(); }
    if(IN.hit.left){ this.pos=Math.max(0,this.pos-1); SFX.menu(); }
    if(IN.hit.start||IN.hit.jump){
      scores.push([this.chars.join(''), G.score]);
      scores.sort((a,b)=>b[1]-a[1]); scores=scores.slice(0,10); saveScores();
      SFX.ok(); G.state='scores'; G.timer=0;
    }
  },
  bump(d){
    const A='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 .!';
    let i = A.indexOf(this.chars[this.pos]); i=(i+d+A.length)%A.length;
    this.chars[this.pos]=A[i]; SFX.menu();
  }
};

const ov = document.getElementById('overlay');
let menuStack = [];
const menuOpen = ()=> menuStack.length>0;

function openMenu(def){
  if(G.state==='play' && !menuStack.length) stopMusic();
  menuStack.push({def, idx: def.startIdx||0});
  if(def.onOpen) def.onOpen();
  drawMenu(); ov.classList.add('on'); SFX.menu();
}
function closeMenu(){
  const m = menuStack.pop();
  if(m && m.def.onClose) m.def.onClose();
  if(!menuStack.length){ ov.classList.remove('on'); ov.innerHTML=''; if(G.state==='play') resumeMusic(); }
  else drawMenu();
  SFX.menu();
}
function closeAllMenus(){ while(menuStack.length) closeMenu(); }
function curMenu(){ return menuStack[menuStack.length-1]; }
function resumeMusic(){ playMusic(P_&&P_.hammer>0?'hammer':(hurry?'hurry':'stage')); }

function drawMenu(){
  const m = curMenu(); if(!m) return;
  const d = m.def;
  if(d.custom){ ov.innerHTML = d.custom(m); return; }
  const items = d.items.filter(i=>!i.hidden||!i.hidden());
  m.items = items;
  if(m.idx>=items.length) m.idx=items.length-1;
  let h = `<div class="m-title">${d.title}</div>`;
  if(d.sub) h += `<div class="m-sub">${d.sub}</div>`;
  items.forEach((it,i)=>{
    if(it.gap){ h += `<div class="m-gap"></div>`; return; }

         `<span class="lbl">${it.label}</span><span class="val">${val}</span></div>`;

  h += `<div class="m-foot">↑↓ wählen · ←→ ändern · ENTER/A bestätigen · ESC/B zurück</div>`;

}
function menuInput(){
  const m = curMenu(); if(!m) return;
  const d = m.def;
  if(d.customInput){ d.customInput(m); return; }
  const items = m.items || d.items;
  if(menuHit('up')){ do{ m.idx=(m.idx-1+items.length)%items.length; }while(items[m.idx].gap); SFX.menu(); drawMenu(); }
  if(menuHit('down')){ do{ m.idx=(m.idx+1)%items.length; }while(items[m.idx].gap); SFX.menu(); drawMenu(); }
  const it = items[m.idx];
  if(!it) return;
  if(menuHit('left')  && it.act){ it.act(-1); save(); drawMenu(); }
  if(menuHit('right') && it.act){ it.act( 1); save(); drawMenu(); }
  if(IN.hit.jump||IN.hit.start){
    if(it.dis && it.dis()){ SFX.no(); }
    else if(it.go){ SFX.ok(); it.go(); }
    else if(it.act){ it.act(1); save(); SFX.menu(); drawMenu(); }
  }
  if(IN.hit.pause||IN.hit.back){ if(d.noBack) SFX.no(); else closeMenu(); }
}

let typeBuf = '';
function globalCodeType(e){
  if(cheatScreen.active || capturing) return false;
  let ch = null;
  if(/^Key[A-Z]$/.test(e.code)) ch = e.code[3];
  else if(/^Digit[0-9]$/.test(e.code)) ch = e.code[5];
  if(!ch){ if(e.code==='Escape'||e.code==='Enter') typeBuf=''; return false; }
  typeBuf = (typeBuf + ch).slice(-16);
  for(const code in CODES){
    if(typeBuf.endsWith(code)){
      typeBuf = '';
      cheatScreen.open();          // Cheat-Menü aufklappen ...
      cheatScreen.code = code;
      cheatScreen.submit();        // ... und den erkannten Code gleich anwenden
      return true;
    }
  }
  return false;
}

    if(e.code!=='Escape'){ S.keys[capturing]=[e.code]; save(); SFX.ok(); }
    capturing=null; rawKeys.clear(); drawMenu(); return;
  }
  if(cheatScreen.active){ cheatScreen.typeKey(e); return; }
  if(globalCodeType(e)) return;
  if(e.code==='F1'){ e.preventDefault(); if(!cheatScreen.active) cheatScreen.open(); return; }
  if(e.code==='F2'){ e.preventDefault(); if(!menuOpen()) openMenu(settingsMenu); return; }
};

/* ---- Joystick am Gehäuse: ziehbar, mit Federrückstellung ------------ */
const JOY_DZ = 0.36;                       // Totzone bis eine Richtung zählt
let joyDrag = null;                        // {nx,ny} während des Ziehens
const joyVis = { x:0, y:0, vx:0, vy:0 };   // gezeichnete Auslenkung (Feder)
function joyDirs(nx, ny){
  touchHeld.left  = nx < -JOY_DZ;
  touchHeld.right = nx >  JOY_DZ;
  touchHeld.up    = ny < -JOY_DZ;
  touchHeld.down  = ny >  JOY_DZ;
}
function joyFromEvent(e){
  const r = joyEl.getBoundingClientRect();
  const rad = r.width*0.42;
  let nx = (e.clientX-(r.left+r.width/2))/rad;
  let ny = (e.clientY-(r.top +r.height*0.32))/rad;
  const len = Math.hypot(nx,ny);
  if(len>1){ nx/=len; ny/=len; }
  joyDrag = {nx,ny}; joyDirs(nx,ny);
}
if(joyEl){
  joyEl.addEventListener('pointerdown', e=>{
    e.preventDefault(); audioUnlock();
    try{ joyEl.setPointerCapture(e.pointerId); }catch(_){}
    joyEl.classList.add('drag'); joyFromEvent(e);
  });
  joyEl.addEventListener('pointermove', e=>{ if(joyDrag) joyFromEvent(e); });
  const stop = ()=>{
    if(!joyDrag) return;
    joyDrag = null; joyEl.classList.remove('drag');
    touchHeld.left=touchHeld.right=touchHeld.up=touchHeld.down=false;
  };
  joyEl.addEventListener('pointerup', stop);
  joyEl.addEventListener('pointercancel', stop);
  joyEl.addEventListener('lostpointercapture', stop);
}
/* ---- Knöpfe am Gehäuse anklickbar ---------------------------------- */
function hookCabButton(el, action){
  if(!el) return;
  el.addEventListener('pointerdown', e=>{
    e.preventDefault(); audioUnlock();
    try{ el.setPointerCapture(e.pointerId); }catch(_){}
    touchHeld[action]=true;
  });
  const off = ()=>{ touchHeld[action]=false; };
  el.addEventListener('pointerup', off);
  el.addEventListener('pointercancel', off);
  el.addEventListener('lostpointercapture', off);
}
hookCabButton(btAEl,'jump');
hookCabButton(btBEl,'start');

/* Der Stick wird jede Frame neu gezeichnet: eine gedämpfte Feder zieht ihn
   zur Zielauslenkung, beim Loslassen schwingt er kurz über die Mitte hinaus. */
function animateCabinet(){
  if(!jsBall) return;
  let tx, ty;
  if(joyDrag){ tx = joyDrag.nx; ty = joyDrag.ny; }
  else {
    tx = (IN.held.right?1:0)-(IN.held.left?1:0);
    ty = (IN.held.down?1:0)-(IN.held.up?1:0);
    const len = Math.hypot(tx,ty); if(len>1){ tx/=len; ty/=len; }
  }
  const k = joyDrag? 0.55 : 0.34, damp = joyDrag? 0.55 : 0.74;
  joyVis.vx = (joyVis.vx + (tx-joyVis.x)*k)*damp;
  joyVis.vy = (joyVis.vy + (ty-joyVis.y)*k)*damp;
  joyVis.x += joyVis.vx; joyVis.y += joyVis.vy;
  if(Math.abs(joyVis.x)<0.0015 && Math.abs(joyVis.vx)<0.0015) { joyVis.x=tx?joyVis.x:0; joyVis.vx=0; }
  if(Math.abs(joyVis.y)<0.0015 && Math.abs(joyVis.vy)<0.0015) { joyVis.y=ty?joyVis.y:0; joyVis.vy=0; }

  const nx = clamp(joyVis.x,-1.15,1.15), ny = clamp(joyVis.y,-1.15,1.15);
  // Kugel läuft auf einer Kugelbahn, der Schaft folgt, die Staubkappe kippt mit
  const bdx = nx*25, bdy = ny*13;
  jsBall.setAttribute('transform',  `translate(${bdx.toFixed(2)},${bdy.toFixed(2)})`);
  jsShaft.setAttribute('x2', (50+nx*18).toFixed(2));
  jsShaft.setAttribute('y2', (38+ny*10).toFixed(2));
  jsShaft.setAttribute('x1', (50+nx*4.5).toFixed(2));
  jsShaft.setAttribute('y1', (88+ny*2).toFixed(2));
  jsWasher.setAttribute('transform',
    `translate(${(nx*4.5).toFixed(2)},${(ny*2).toFixed(2)}) rotate(${(nx*7).toFixed(2)} 50 88)`);
  jsShadow.setAttribute('cx', (50+nx*15).toFixed(2));
  jsShadow.setAttribute('rx', (15-Math.abs(nx)*3).toFixed(2));
  jsShadow.setAttribute('opacity', (0.5-Math.abs(nx)*0.14).toFixed(2));
  btAEl.classList.toggle('on', IN.held.jump);
  btBEl.classList.toggle('on', IN.held.start||IN.held.pause);
}

function setupTouch(){

  wrap.innerHTML=''; wrap.classList.toggle('on', want);
  for(const k in touchHeld) delete touchHeld[k];
  if(!want) return;
  const mk=(a,label,style)=>{
    const d=document.createElement('div'); d.className='tbtn'; d.textContent=label;
    d.style.cssText += style;
    const on=(e)=>{ e.preventDefault(); touchHeld[a]=true; d.classList.add('hit'); audioUnlock(); };
    const off=(e)=>{ e.preventDefault(); touchHeld[a]=false; d.classList.remove('hit'); };
    d.addEventListener('touchstart',on,{passive:false}); d.addEventListener('touchend',off);
    d.addEventListener('touchcancel',off); d.addEventListener('mousedown',on); d.addEventListener('mouseup',off);
    d.addEventListener('mouseleave',off);
    wrap.appendChild(d); return d;
  };
  const S1='width:15%;aspect-ratio:1;';
  mk('left','◀',  S1+'left:2%;bottom:6%;');
  mk('right','▶', S1+'left:20%;bottom:6%;');
  mk('up','▲',    S1+'left:11%;bottom:22%;');
  mk('down','▼',  S1+'left:11%;bottom:-2%;');
  mk('jump','A',  'width:19%;aspect-ratio:1;right:3%;bottom:8%;');
  mk('start','▶|','width:11%;aspect-ratio:1;right:3%;top:3%;font-size:10px;');
  mk('pause','⏸','width:11%;aspect-ratio:1;left:3%;top:3%;font-size:10px;');
}
/* -------------------------------------------------------------- Render */
let fpsTxt='', fpsAcc=0, fpsCnt=0;
function render(){
  switch(G.state){
    case 'title':   drawTitle(); break;
    case 'scores':  drawScores(); break;
    case 'howhigh': drawHowHigh(); break;
    case 'name':    drawNameEntry(); break;
    default:
      drawScene(); drawPlayOverlays();
      if(G.state==='gameover') drawGameOver();
  }
  if(menuOpen() && G.state==='play'){ /* Menü liegt als DOM darüber */ }
  ctx.save();
  let filt = '';
  if(CHEAT.regenbogen || kaosFx.disco) filt = `hue-rotate(${(G.frame*4)%360}deg) saturate(1.5)`;
  else if(CHEAT.kaos) filt = `hue-rotate(${(Math.sin(G.frame*0.02)*30).toFixed(0)}deg) saturate(1.15)`;
  ctx.filter = filt || 'none';
  let sx=0, sy=0;
  if(S.shake && G.shake>0.2){ sx=rnd(G.shake,-G.shake)|0; sy=rnd(G.shake,-G.shake)|0; }
  ctx.fillStyle='#000'; ctx.fillRect(0,0,CW,CH);
  if(kaosFx.mirror){ ctx.translate(CW,0); ctx.scale(-1,1); }
  if(kaosFx.flip){   ctx.translate(0,CH); ctx.scale(1,-1); }
  ctx.drawImage(buf, sx, sy);
  ctx.restore();
  animateCabinet();
  if(G.flash>0){
    if(S.flashFx) flashEl.style.opacity = (G.flash*0.55).toFixed(2);
    G.flash -= 0.06; if(G.flash<0){G.flash=0; flashEl.style.opacity=0;}
  }
}
/* ---------------------------------------------------------- Hauptloop */
let lastT = 0, acc = 0;
function loop(ts){
  requestAnimationFrame(loop);
  const dtms = Math.min(100, ts-lastT || 16.7); lastT = ts;
  fpsAcc += dtms; fpsCnt++;
  if(fpsAcc>500){ fpsTxt = 'FPS '+Math.round(1000/(fpsAcc/fpsCnt)); fpsAcc=0; fpsCnt=0; }
  pollInput();
  checkKonami();
  if(menuOpen()){
    menuInput();
  } else {
    if(IN.hit.pause){
      if(G.state==='play'||G.state==='howhigh'){ openMenu(pauseMenu); }
      else if(G.state==='title'){ openMenu(settingsMenu); }
    }
    acc += dtms;
    let guard=0;
    while(acc >= 16.6667 && guard++ < 5){ stepState(1/60); acc -= 16.6667; }
    if(acc>200) acc=0;
  }
  render();
}
/* ------------------------------------------------------------- Start */
(function boot(){
  applyVideo(); resize(); setupTouch();
  G.state='title'; G.timer=0;
  // Vorschau-Level für den Hintergrund der Titelmusik-Logik
  G.stage=0;
  requestAnimationFrame(loop);
})();
</script>
